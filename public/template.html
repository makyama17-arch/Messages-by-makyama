  /* =====================================================
     URL
  ===================================================== */

  const params =
    new URLSearchParams(
      window.location.search
    );

  const id =
    params.get("id");

  /* =====================================================
     ELEMENTS
  ===================================================== */

  const title =
    document.getElementById("title");

  const messageBox =
    document.getElementById("messageBox");

  const nameBox =
    document.getElementById("nameBox");

  const nameInput =
    document.getElementById("nameInput");

  const playBtn =
    document.getElementById("playBtn");

  const shareBtn =
    document.getElementById("shareBtn");

  const downloadBtn =
    document.getElementById("downloadBtn");

  const downloadAd =
    document.getElementById("downloadAd");

  /* =====================================================
     DATA
  ===================================================== */

  let template = null;

  /*
    Video settings
  */

  const VIDEO_FPS = 24;

  const VIDEO_WIDTH = 720;

  const VIDEO_HEIGHT = 720;

  const DEFAULT_DURATION = 5000;

  /* =====================================================
     LOAD TEMPLATE
  ===================================================== */

  async function loadTemplate() {

    if (!id) {

      showError(
        "Message ID is missing."
      );

      return;

    }

    try {

      const response =
        await fetch(
          "/api/templates/" +
          encodeURIComponent(id)
        );

      if (!response.ok) {

        throw new Error(
          "Template not found."
        );

      }

      template =
        await response.json();

      title.textContent =
        template.title ||
        "MAKYAMA Message";

      if (template.nameRequired) {

        nameBox.style.display =
          "block";

      }

      renderMessage();

      loadAds();

    } catch (error) {

      console.error(error);

      showError(
        "Message could not be loaded."
      );

    }

  }

  /* =====================================================
     ERROR
  ===================================================== */

  function showError(message) {

    messageBox.innerHTML = `

      <div class="loading">

        <div style="
          font-size:42px;
          margin-bottom:5px;
        ">
          📭
        </div>

        <div style="
          color:#a1aec6;
          font-weight:700;
        ">
          ${escapeHtml(message)}
        </div>

        <a
          href="/"
          style="
            margin-top:7px;
            color:#72a5ff;
            text-decoration:none;
            font-size:11px;
          "
        >
          ← Return to messages
        </a>

      </div>

    `;

  }

  /* =====================================================
     RENDER MESSAGE
  ===================================================== */

  function renderMessage() {

    if (!template) return;

    let html =
      template.html || "";

    const name =
      nameInput.value.trim() ||
      "Rafiki";

    html =
      html.replaceAll(
        "{name}",
        escapeHtml(name)
      );

    messageBox.innerHTML =
      html;

    runAnimations();

  }

  /* =====================================================
     RUN ANIMATIONS
  ===================================================== */

  function runAnimations() {

    const elements =
      messageBox.querySelectorAll(
        "[data-animation]"
      );

    elements.forEach(
      element => {

        const animation =
          element.dataset.animation;

        if (!animation) return;

        element.style.animation =
          "none";

        void element.offsetWidth;

        element.style.animation =
          animation;

      }
    );

  }

  /* =====================================================
     ESCAPE
  ===================================================== */

  function escapeHtml(value) {

    const div =
      document.createElement("div");

    div.textContent =
      value;

    return div.innerHTML;

  }

  /* =====================================================
     NAME
  ===================================================== */

  nameInput.addEventListener(
    "input",
    () => {

      renderMessage();

    }
  );

  /* =====================================================
     PLAY
  ===================================================== */

  playBtn.addEventListener(
    "click",
    () => {

      if (!template) return;

      renderMessage();

      playBtn.textContent =
        "↻ Replay Animation";

      setTimeout(() => {

        playBtn.textContent =
          "▶ Play Animation";

      }, 1500);

    }
  );

  /* =====================================================
     SHARE
  ===================================================== */

  shareBtn.addEventListener(
    "click",
    async () => {

      if (!template) return;

      /*
        Put the name inside the URL
        so the recipient can see it.
      */

      const url =
        new URL(
          window.location.href
        );

      const name =
        nameInput.value.trim();

      if (name) {

        url.searchParams.set(
          "name",
          name
        );

      }

      const shareUrl =
        url.toString();

      try {

        if (navigator.share) {

          await navigator.share({

            title:
              template.title ||
              "MAKYAMA Message",

            text:
              "Check out this animated message on MAKYAMA MESSAGES.",

            url:
              shareUrl

          });

        } else {

          await navigator.clipboard
            .writeText(shareUrl);

          showTemporaryMessage(
            "✓ Message link copied"
          );

        }

      } catch (error) {

        console.log(error);

      }

    }
  );

  /* =====================================================
     TEMPORARY MESSAGE
  ===================================================== */

  function showTemporaryMessage(message) {

    const old =
      document.getElementById(
        "temporaryMessage"
      );

    if (old) {

      old.remove();

    }

    const box =
      document.createElement("div");

    box.id =
      "temporaryMessage";

    box.textContent =
      message;

    box.style.position =
      "fixed";

    box.style.left =
      "50%";

    box.style.bottom =
      "25px";

    box.style.transform =
      "translateX(-50%)";

    box.style.padding =
      "11px 16px";

    box.style.borderRadius =
      "999px";

    box.style.background =
      "rgba(25,35,65,.95)";

    box.style.border =
      "1px solid rgba(255,255,255,.1)";

    box.style.color =
      "white";

    box.style.fontSize =
      "12px";

    box.style.fontWeight =
      "700";

    box.style.zIndex =
      "99999";

    document.body.appendChild(box);

    setTimeout(() => {

      box.remove();

    }, 2500);

  }

  /* =====================================================
     GET ANIMATION DURATION
  ===================================================== */

  function getAnimationDuration() {

    let longest =
      DEFAULT_DURATION;

    const elements =
      messageBox.querySelectorAll("*");

    elements.forEach(
      element => {

        const style =
          getComputedStyle(element);

        const duration =
          parseTime(
            style.animationDuration
          );

        const delay =
          parseTime(
            style.animationDelay
          );

        const total =
          duration + delay;

        if (
          Number.isFinite(total) &&
          total > longest
        ) {

          longest = total;

        }

      }
    );

    /*
      Give animations a little
      extra time to finish.
    */

    longest += 500;

    /*
      Prevent extremely long videos.
    */

    return Math.min(
      Math.max(
        longest,
        3000
      ),
      15000
    );

  }

  /* =====================================================
     PARSE CSS TIME
  ===================================================== */

  function parseTime(value) {

    if (!value) return 0;

    const first =
      value
        .split(",")[0]
        .trim();

    if (
      first.endsWith("ms")
    ) {

      return parseFloat(
        first
      ) || 0;

    }

    if (
      first.endsWith("s")
    ) {

      return (
        parseFloat(first) *
        1000
      ) || 0;

    }

    return 0;

  }

  /* =====================================================
     WAIT
  ===================================================== */

  function wait(ms) {

    return new Promise(
      resolve =>
        setTimeout(
          resolve,
          ms
        )
    );

  }

  /* =====================================================
     DOWNLOAD VIDEO
  ===================================================== */

  downloadBtn.addEventListener(
    "click",
    async () => {

      if (!template) return;

      /*
        Prevent double clicks.
      */

      downloadBtn.disabled =
        true;

      playBtn.disabled =
        true;

      shareBtn.disabled =
        true;

      const oldText =
        downloadBtn.textContent;

      try {

        /*
          Count download.
        */

        try {

          await fetch(
            "/api/analytics/download",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({
                  templateId:
                    template.id
                })
            }
          );

        } catch (analyticsError) {

          console.log(
            "Analytics error:",
            analyticsError
          );

        }

        /*
          Make sure animation
          starts from beginning.
        */

        renderMessage();

        await wait(100);

        /*
          Detect animation length.
        */

        const duration =
          getAnimationDuration();

        /*
          Show progress.
        */

        downloadBtn.textContent =
          "⏳ Preparing 0%";

        /*
          Create canvas.
        */

        const canvas =
          document.createElement(
            "canvas"
          );

        canvas.width =
          VIDEO_WIDTH;

        canvas.height =
          VIDEO_HEIGHT;

        const ctx =
          canvas.getContext(
            "2d"
          );

        /*
          Record canvas.
        */

        const stream =
          canvas.captureStream(
            VIDEO_FPS
          );

        /*
          Try MP4 first.
        */

        let mimeType =
          "";

        if (
          MediaRecorder.isTypeSupported(
            "video/mp4;codecs=h264"
          )
        ) {

          mimeType =
            "video/mp4;codecs=h264";

        } else if (
          MediaRecorder.isTypeSupported(
            "video/webm;codecs=vp9"
          )
        ) {

          mimeType =
            "video/webm;codecs=vp9";

        } else {

          mimeType =
            "video/webm";

        }

        const recorder =
          new MediaRecorder(
            stream,
            {
              mimeType:
                mimeType,

              videoBitsPerSecond:
                5000000
            }
          );

        const chunks = [];

        recorder.ondataavailable =
          event => {

            if (
              event.data &&
              event.data.size > 0
            ) {

              chunks.push(
                event.data
              );

            }

          };

        /*
          Start recording.
        */

        recorder.start();

        /*
          Render frames.
        */

        const start =
          performance.now();

        let lastFrame =
          -1;

        while (true) {

          const now =
            performance.now();

          const elapsed =
            now - start;

          if (
            elapsed >= duration
          ) {

            break;

          }

          const frame =
            Math.floor(
              elapsed /
              (1000 / VIDEO_FPS)
            );

          if (
            frame !== lastFrame
          ) {

            lastFrame =
              frame;

            try {

              const shot =
                await html2canvas(
                  messageBox,
                  {
                    backgroundColor:
                      "#07101f",

                    scale: 1,

                    useCORS: true,

                    allowTaint: false,

                    logging: false,

                    width:
                      messageBox.clientWidth,

                    height:
                      messageBox.clientHeight
                  }
                );

              /*
                Clear canvas.
              */

              ctx.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
              );

              /*
                Draw screenshot
                into video canvas.
              */

              const sourceRatio =
                shot.width /
                shot.height;

              const targetRatio =
                canvas.width /
                canvas.height;

              let drawWidth =
                canvas.width;

              let drawHeight =
                canvas.height;

              let offsetX = 0;

              let offsetY = 0;

              if (
                sourceRatio >
                targetRatio
              ) {

                drawHeight =
                  canvas.width /
                  sourceRatio;

                offsetY =
                  (
                    canvas.height -
                    drawHeight
                  ) / 2;

              } else {

                drawWidth =
                  canvas.height *
                  sourceRatio;

                offsetX =
                  (
                    canvas.width -
                    drawWidth
                  ) / 2;

              }

              ctx.drawImage(
                shot,
                offsetX,
                offsetY,
                drawWidth,
                drawHeight
              );

            } catch (frameError) {

              console.log(
                "Frame error:",
                frameError
              );

            }

            const percent =
              Math.min(
                99,
                Math.floor(
                  (
                    elapsed /
                    duration
                  ) * 100
                )
              );

            downloadBtn.textContent =
              "⏳ Recording " +
              percent +
              "%";

          }

          /*
            Wait for next frame.
          */

          await wait(
            1000 /
            VIDEO_FPS
          );

        }

        /*
          Stop recorder.
        */

        recorder.stop();

        await new Promise(
          resolve => {

            recorder.onstop =
              resolve;

          }
        );

        /*
          Create recorded video.
        */

        const recordedBlob =
          new Blob(
            chunks,
            {
              type:
                mimeType
            }
          );

        /*
          If browser already recorded
          MP4, download directly.
        */

        if (
          mimeType.startsWith(
            "video/mp4"
          )
        ) {

          downloadBlob(
            recordedBlob,
            makeFileName() +
            ".mp4"
          );

          showTemporaryMessage(
            "✓ MP4 video ready"
          );

          return;

        }

        /*
          Otherwise convert WebM
          to MP4 with FFmpeg.
        */

        downloadBtn.textContent =
          "⏳ Converting to MP4...";

        const mp4Blob =
          await convertWebMToMP4(
            recordedBlob
          );

        downloadBlob(
          mp4Blob,
          makeFileName() +
          ".mp4"
        );

        showTemporaryMessage(
          "✓ MP4 video downloaded"
        );

      } catch (error) {

        console.error(
          "Video download error:",
          error
        );

        showTemporaryMessage(
          "❌ Video failed. Try again."
        );

      } finally {

        downloadBtn.disabled =
          false;

        playBtn.disabled =
          false;

        shareBtn.disabled =
          false;

        downloadBtn.textContent =
          oldText;

      }

    }
  );

  /* =====================================================
     FFMPEG CONVERSION
  ===================================================== */

  async function convertWebMToMP4(
    webmBlob
  ) {

    /*
      Check FFmpeg.
    */

    if (
      typeof FFmpeg ===
      "undefined"
    ) {

      throw new Error(
        "FFmpeg is not available."
      );

    }

    const {
      createFFmpeg,
      fetchFile
    } = FFmpeg;

    const ffmpeg =
      createFFmpeg({
        log: false
      });

    /*
      Load FFmpeg.
    */

    if (!ffmpeg.isLoaded()) {

      downloadBtn.textContent =
        "⏳ Loading video engine...";

      await ffmpeg.load();

    }

    /*
      Convert Blob to bytes.
    */

    const input =
      await fetchFile(
        webmBlob
      );

    /*
      Write WebM.
    */

    ffmpeg.FS(
      "writeFile",
      "input.webm",
      input
    );

    /*
      Convert to MP4.
    */

    await ffmpeg.run(
      "-i",
      "input.webm",

      "-c:v",
      "libx264",

      "-preset",
      "ultrafast",

      "-pix_fmt",
      "yuv420p",

      "-movflags",
      "+faststart",

      "output.mp4"
    );

    /*
      Read MP4.
    */

    const data =
      ffmpeg.FS(
        "readFile",
        "output.mp4"
      );

    /*
      Cleanup.
    */

    try {

      ffmpeg.FS(
        "unlink",
        "input.webm"
      );

      ffmpeg.FS(
        "unlink",
        "output.mp4"
      );

    } catch (cleanupError) {

      console.log(
        cleanupError
      );

    }

    return new Blob(
      [data.buffer],
      {
        type:
          "video/mp4"
      }
    );

  }

  /* =====================================================
     DOWNLOAD BLOB
  ===================================================== */

  function downloadBlob(
    blob,
    filename
  ) {

    const url =
      URL.createObjectURL(
        blob
      );

    const link =
      document.createElement(
        "a"
      );

    link.href =
      url;

    link.download =
      filename;

    document.body.appendChild(
      link
    );

    link.click();

    link.remove();

    setTimeout(() => {

      URL.revokeObjectURL(
        url
      );

    }, 5000);

  }

  /* =====================================================
     FILE NAME
  ===================================================== */

  function makeFileName() {

    const base =
      template &&
      template.title
        ? template.title
        : "MAKYAMA_Message";

    const clean =
      base
        .replace(
          /[^a-z0-9_\- ]/gi,
          ""
        )
        .trim()
        .replace(
          /\s+/g,
          "_"
        );

    return (
      "MAKYAMA_" +
      (
        clean ||
        "Message"
      )
    );

  }

  /* =====================================================
     LOAD ADS
  ===================================================== */

  async function loadAds() {

    try {

      const response =
        await fetch(
          "/api/ads"
        );

      if (!response.ok) {
        return;
      }

      const ads =
        await response.json();

      const downloadAds =
        ads.filter(
          ad =>
            ad &&
            ad.enabled === true &&
            ad.position ===
              "download"
        );

      if (
        downloadAds.length === 0
      ) {

        downloadAd.style.display =
          "none";

        return;

      }

      const ad =
        downloadAds[0];

      if (ad.code) {

        downloadAd.innerHTML =
          ad.code;

      } else {

        downloadAd.textContent =
          ad.title ||
          "Advertisement";

      }

    } catch (error) {

      console.log(
        "Ad loading error:",
        error
      );

      downloadAd.style.display =
        "none";

    }

  }

  /* =====================================================
     NAME FROM SHARED URL
  ===================================================== */

  const sharedName =
    params.get("name");

  if (sharedName) {

    nameInput.value =
      sharedName;

  }

  /* =====================================================
     START
  ===================================================== */

  loadTemplate();

</script></body></html>
