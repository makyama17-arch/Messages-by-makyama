<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>MAKYAMA MESSAGES</title>

<meta
  name="theme-color"
  content="#07101f"
>

<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  min-height:100%;
}

body{

  background:
    radial-gradient(
      circle at top,
      #132846 0%,
      #07101f 45%,
      #030811 100%
    );

  color:#fff;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  min-height:100vh;
}

button,
input{
  font:inherit;
}

button{
  cursor:pointer;
}

.mk-page{

  width:100%;

  min-height:100vh;

  display:flex;

  justify-content:center;

  padding:20px 12px 40px;

}

.mk-container{

  width:100%;

  max-width:720px;

}

.mk-header{

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:12px;

  margin-bottom:18px;

}

.mk-back{

  border:1px solid
    rgba(255,255,255,.12);

  background:
    rgba(255,255,255,.06);

  color:#fff;

  border-radius:12px;

  padding:10px 14px;

  text-decoration:none;

  font-size:14px;

}

.mk-brand{

  font-weight:900;

  letter-spacing:1px;

  font-size:15px;

  text-align:right;

}

.mk-brand span{

  display:block;

  color:
    rgba(255,255,255,.48);

  font-size:9px;

  margin-top:3px;

  letter-spacing:.6px;

}

.mk-title{

  text-align:center;

  font-size:27px;

  font-weight:900;

  margin:8px 0 18px;

}

.mk-card{

  background:
    rgba(255,255,255,.055);

  border:1px solid
    rgba(255,255,255,.10);

  border-radius:22px;

  padding:16px;

  box-shadow:
    0 20px 60px
    rgba(0,0,0,.28);

  backdrop-filter:
    blur(14px);

  -webkit-backdrop-filter:
    blur(14px);

}

.mk-label{

  display:block;

  font-size:12px;

  color:
    rgba(255,255,255,.58);

  margin-bottom:7px;

}

#nameInput{

  width:100%;

  border:1px solid
    rgba(255,255,255,.12);

  background:
    rgba(0,0,0,.22);

  color:#fff;

  border-radius:13px;

  padding:13px 14px;

  outline:none;

  margin-bottom:14px;

}

#nameInput:focus{

  border-color:
    rgba(255,255,255,.32);

}

#messageBox{

  width:100%;

  min-height:280px;

  border-radius:18px;

  overflow:hidden;

  background:#07101f;

  border:1px solid
    rgba(255,255,255,.08);

  position:relative;

}

.mk-buttons{

  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:9px;

  margin-top:14px;

}

.mk-btn{

  border:0;

  border-radius:13px;

  padding:12px 8px;

  color:#fff;

  font-weight:800;

  background:
    rgba(255,255,255,.08);

  border:1px solid
    rgba(255,255,255,.10);

}

.mk-btn:hover{

  background:
    rgba(255,255,255,.13);

}

.mk-btn:disabled{

  opacity:.45;

  cursor:not-allowed;

}

.mk-download{

  background:
    linear-gradient(
      135deg,
      #1d7df2,
      #6d4aff
    );

  border-color:transparent;

}

.mk-info{

  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:8px;

  margin-top:14px;

}

.mk-pill{

  text-align:center;

  padding:9px 5px;

  border-radius:12px;

  background:
    rgba(255,255,255,.045);

  border:1px solid
    rgba(255,255,255,.07);

  font-size:10px;

  color:
    rgba(255,255,255,.58);

}

/* =====================================================
DOWNLOAD FALLBACK
===================================================== */

#downloadFallback{

  display:none;

  margin-top:13px;

  padding:13px;

  border-radius:14px;

  background:
    rgba(29,125,242,.10);

  border:1px solid
    rgba(29,125,242,.28);

  text-align:center;

}

#downloadFallback.show{

  display:block;

}

#downloadFallbackText{

  font-size:12px;

  color:
    rgba(255,255,255,.72);

  margin-bottom:9px;

}

#manualDownloadLink{

  display:inline-block;

  text-decoration:none;

  color:#fff;

  font-weight:900;

  background:
    linear-gradient(
      135deg,
      #1d7df2,
      #6d4aff
    );

  padding:11px 17px;

  border-radius:11px;

  font-size:13px;

}

/* =====================================================
TEMPORARY MESSAGE
===================================================== */

#temporaryMessage{

  position:fixed;

  left:50%;

  bottom:20px;

  transform:
    translateX(-50%)
    translateY(20px);

  z-index:999999;

  max-width:
    calc(100% - 30px);

  padding:12px 16px;

  border-radius:13px;

  background:
    rgba(8,14,27,.94);

  border:1px solid
    rgba(255,255,255,.12);

  box-shadow:
    0 12px 40px
    rgba(0,0,0,.35);

  font-size:12px;

  opacity:0;

  pointer-events:none;

  transition:
    .25s ease;

}

#temporaryMessage.show{

  opacity:1;

  transform:
    translateX(-50%)
    translateY(0);

}

/* =====================================================
DOWNLOAD AD OVERLAY
===================================================== */

#downloadAdOverlay{

  display:none;

  position:fixed;

  inset:0;

  z-index:999998;

  background:
    rgba(0,0,0,.78);

  align-items:center;

  justify-content:center;

  padding:20px;

}

#downloadAdOverlay.show{

  display:flex;

}

.download-ad-box{

  width:100%;

  max-width:420px;

  min-height:180px;

  border-radius:20px;

  background:
    #081323;

  border:1px solid
    rgba(255,255,255,.10);

  display:flex;

  align-items:center;

  justify-content:center;

  overflow:hidden;

  position:relative;

}

.download-ad-label{

  position:absolute;

  top:8px;

  left:10px;

  font-size:9px;

  color:
    rgba(255,255,255,.38);

}

/* =====================================================
RESPONSIVE
===================================================== */

@media(max-width:600px){

  .mk-page{

    padding:
      14px 9px 30px;

  }

  .mk-card{

    padding:12px;

    border-radius:18px;

  }

  .mk-title{

    font-size:23px;

  }

  .mk-buttons{

    grid-template-columns:
      1fr;

  }

  .mk-info{

    grid-template-columns:
      repeat(3,1fr);

  }

}

</style>

</head>

<body>

<div class="mk-page">

  <main class="mk-container">

    <header class="mk-header">

      <a
        href="/"
        class="mk-back"
      >
        ← Back
      </a>

      <div class="mk-brand">

        MAKYAMA

        <span>
          MESSAGES
        </span>

      </div>

    </header>

    <h1
      id="templateTitle"
      class="mk-title"
    >
      Loading...
    </h1>

    <section class="mk-card">

      <label
        class="mk-label"
        for="nameInput"
      >
        Your name
      </label>

      <input
        id="nameInput"
        type="text"
        maxlength="80"
        placeholder="Enter your name"
        autocomplete="name"
      >

      <div
        id="messageBox"
      ></div>

      <div class="mk-buttons">

        <button
          id="playBtn"
          class="mk-btn"
          type="button"
        >
          ▶ Play
        </button>

        <button
          id="shareBtn"
          class="mk-btn"
          type="button"
        >
          ↗ Share
        </button>

        <button
          id="downloadBtn"
          class="mk-btn mk-download"
          type="button"
        >
          ↓ Download MP4
        </button>

      </div>

      <div
        id="downloadFallback"
      >

        <div
          id="downloadFallbackText"
        >
          MP4 iko tayari. Kama download haikuanza yenyewe, bonyeza hapa:
        </div>

        <a
          id="manualDownloadLink"
          href="#"
          target="_blank"
          rel="noopener"
        >
          ↓ Download MP4
        </a>

      </div>

      <div class="mk-info">

        <div class="mk-pill">
          Interactive
        </div>

        <div class="mk-pill">
          MP4
        </div>

        <div class="mk-pill">
          MAKYAMA
        </div>

      </div>

    </section>

  </main>

</div>

<!-- =====================================================
DOWNLOAD AD
===================================================== -->

<div
  id="downloadAdOverlay"
>

  <div class="download-ad-box">

    <span
      class="download-ad-label"
    >
      Advertisement
    </span>

    <div
      id="downloadAdContainer"
    ></div>

  </div>

</div>

<div
  id="temporaryMessage"
></div>

<script>

"use strict";

/* =====================================================
ELEMENTS
===================================================== */

const templateTitle =
  document.getElementById(
    "templateTitle"
  );

const nameInput =
  document.getElementById(
    "nameInput"
  );

const messageBox =
  document.getElementById(
    "messageBox"
  );

const playBtn =
  document.getElementById(
    "playBtn"
  );

const shareBtn =
  document.getElementById(
    "shareBtn"
  );

const downloadBtn =
  document.getElementById(
    "downloadBtn"
  );

const downloadFallback =
  document.getElementById(
    "downloadFallback"
  );

const manualDownloadLink =
  document.getElementById(
    "manualDownloadLink"
  );

const temporaryMessage =
  document.getElementById(
    "temporaryMessage"
  );

const downloadAdOverlay =
  document.getElementById(
    "downloadAdOverlay"
  );

const downloadAdContainer =
  document.getElementById(
    "downloadAdContainer"
  );

/* =====================================================
STATE
===================================================== */

let template = null;

let ads = [];

let currentObjectUrl = null;

let messageTimer = null;

/* =====================================================
GET TEMPLATE ID
===================================================== */

function getTemplateId(){

  const params =
    new URLSearchParams(
      window.location.search
    );

  return String(
    params.get("id") || ""
  ).trim();

}

/* =====================================================
TEMPORARY MESSAGE
===================================================== */

function showTemporaryMessage(
  message
){

  clearTimeout(
    messageTimer
  );

  temporaryMessage.textContent =
    message;

  temporaryMessage.classList.add(
    "show"
  );

  messageTimer =
    setTimeout(
      () => {

        temporaryMessage.classList.remove(
          "show"
        );

      },
      3200
    );

}

/* =====================================================
ESCAPE HTML
===================================================== */

function escapeHtml(
  value
){

  return String(
    value || ""
  )

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}

/* =====================================================
RENDER MESSAGE
===================================================== */

function renderMessage(){

  if (!template){

    messageBox.innerHTML = "";

    return;

  }

  let html =
    String(
      template.html || ""
    );

  const name =
    nameInput.value.trim() ||
    "Rafiki";

  html =
    html.replaceAll(
      "{name}",
      escapeHtml(name)
    );

  messageBox.innerHTML =
    "";

  const wrapper =
    document.createElement(
      "div"
    );

  wrapper.innerHTML =
    html;

  /*
    Move normal content into
    the message box.
  */

  while (
    wrapper.firstChild
  ){

    messageBox.appendChild(
      wrapper.firstChild
    );

  }

  /*
    Execute template scripts.

    This keeps the website version
    interactive.

    These scripts are NOT included
    in the MP4 renderer.
  */

  const scripts =
    Array.from(
      messageBox.querySelectorAll(
        "script"
      )
    );

  scripts.forEach(
    oldScript => {

      const newScript =
        document.createElement(
          "script"
        );

      Array.from(
        oldScript.attributes
      ).forEach(
        attribute => {

          newScript.setAttribute(
            attribute.name,
            attribute.value
          );

        }
      );

      newScript.textContent =
        oldScript.textContent ||
        "";

      oldScript.parentNode.replaceChild(
        newScript,
        oldScript
      );

    }
  );

  /*
    Basic delegated action support.
  */

  messageBox.addEventListener(
    "click",
    event => {

      const actionElement =
        event.target.closest(
          "[data-mk-action]"
        );

      if (!actionElement){
        return;
      }

      const action =
        actionElement.getAttribute(
          "data-mk-action"
        );

      if (
        action === "close"
      ){

        messageBox.innerHTML =
          "";

      }

    }
  );

}

/* =====================================================
PLAY
===================================================== */

playBtn.addEventListener(
  "click",
  () => {

    renderMessage();

    showTemporaryMessage(
      "▶ Animation restarted"
    );

  }
);

/* =====================================================
NAME CHANGE
===================================================== */

nameInput.addEventListener(
  "input",
  () => {

    renderMessage();

  }
);

/* =====================================================
SHARE
===================================================== */

shareBtn.addEventListener(
  "click",
  async () => {

    const url =
      window.location.href;

    try {

      if (
        navigator.share
      ){

        await navigator.share({

          title:
            template?.title ||
            "MAKYAMA MESSAGE",

          text:
            "Check out this MAKYAMA message.",

          url

        });

        return;

      }

      if (
        navigator.clipboard
      ){

        await navigator.clipboard.writeText(
          url
        );

        showTemporaryMessage(
          "✓ Link copied"
        );

        return;

      }

      showTemporaryMessage(
        "Copy this page link to share."
      );

    } catch (error) {

      if (
        error &&
        error.name ===
        "AbortError"
      ){

        return;

      }

      console.error(
        "Share error:",
        error
      );

      showTemporaryMessage(
        "Unable to share right now."
      );

    }

  }
);

/* =====================================================
LOAD ADS
===================================================== */

async function loadAds(){

  try {

    const response =
      await fetch(
        "/api/ads",
        {
          cache:
            "no-store"
        }
      );

    if (
      !response.ok
    ){

      return;

    }

    const data =
      await response.json();

    ads =
      Array.isArray(data)
        ? data
        : [];

  } catch (error) {

    console.error(
      "Ads load error:",
      error
    );

    ads = [];

  }

}

/* =====================================================
EXECUTE AD CODE
===================================================== */

function executeAdCode(
  code,
  container
){

  container.innerHTML =
    "";

  if (!code){

    return;

  }

  const wrapper =
    document.createElement(
      "div"
    );

  wrapper.style.width =
    "100%";

  wrapper.style.minHeight =
    "1px";

  wrapper.innerHTML =
    String(code);

  const scripts =
    wrapper.querySelectorAll(
      "script"
    );

  scripts.forEach(
    oldScript => {

      const newScript =
        document.createElement(
          "script"
        );

      Array.from(
        oldScript.attributes
      ).forEach(
        attribute => {

          newScript.setAttribute(
            attribute.name,
            attribute.value
          );

        }
      );

      newScript.textContent =
        oldScript.textContent ||
        "";

      oldScript.parentNode.replaceChild(
        newScript,
        oldScript
      );

    }
  );

  container.appendChild(
    wrapper
  );

}

/* =====================================================
GET DOWNLOAD AD
===================================================== */

function getDownloadAd(){

  return ads.find(
    ad => {

      return (

        ad &&

        ad.enabled === true &&

        ad.position ===
          "download" &&

        String(
          ad.code || ""
        ).trim()

      );

    }
  );

}

/* =====================================================
TRIGGER DOWNLOAD AD
===================================================== */

function triggerDownloadAd(){

  return new Promise(
    resolve => {

      const ad =
        getDownloadAd();

      if (!ad){

        resolve();

        return;

      }

      executeAdCode(
        ad.code,
        downloadAdContainer
      );

      downloadAdOverlay.classList.add(
        "show"
      );

      setTimeout(
        () => {

          downloadAdOverlay.classList.remove(
            "show"
          );

          downloadAdContainer.innerHTML =
            "";

          resolve();

        },
        1800
      );

    }
  );

}

/* =====================================================
MAKE FILE NAME
===================================================== */

function makeFileName(){

  const title =
    String(
      template?.title ||
      "MAKYAMA_Message"
    )

      .replace(
        /[^a-zA-Z0-9]+/g,
        "_"
      )

      .replace(
        /^_+|_+$/g,
        ""
      )

      .slice(
        0,
        60
      );

  return (
    title ||
    "MAKYAMA_Message"
  );

}

/* =====================================================
RELEASE OLD OBJECT URL
===================================================== */

function releaseOldObjectUrl(){

  if (
    currentObjectUrl
  ){

    try {

      URL.revokeObjectURL(
        currentObjectUrl
      );

    } catch (error){

      console.log(error);

    }

    currentObjectUrl =
      null;

  }

}

/* =====================================================
DOWNLOAD BLOB
===================================================== */

function downloadBlob(
  blob,
  filename
){

  if (
    !blob ||
    blob.size <= 0
  ){

    throw new Error(
      "Empty video received."
    );

  }

  releaseOldObjectUrl();

  const url =
    URL.createObjectURL(
      blob
    );

  currentObjectUrl =
    url;

  /*
    Keep the link visible as a
    manual fallback.

    This is important on Android
    browsers that block automatic
    downloads after async fetches.
  */

  manualDownloadLink.href =
    url;

  manualDownloadLink.download =
    filename;

  manualDownloadLink.target =
    "_blank";

  downloadFallback.classList.add(
    "show"
  );

  /*
    Try automatic browser download.
  */

  const link =
    document.createElement(
      "a"
    );

  link.href =
    url;

  link.download =
    filename;

  link.rel =
    "noopener";

  link.style.display =
    "none";

  document.body.appendChild(
    link
  );

  try {

    link.click();

  } catch (error) {

    console.error(
      "Automatic download blocked:",
      error
    );

  }

  link.remove();

  /*
    Do NOT revoke the object URL
    immediately.

    The manual button needs it.
  */

  setTimeout(
    () => {

      /*
        Leave it available for the
        user for one minute.
      */

      if (
        currentObjectUrl ===
        url
      ){

        releaseOldObjectUrl();

      }

    },
    60000
  );

}

/* =====================================================
MANUAL DOWNLOAD LINK
===================================================== */

manualDownloadLink.addEventListener(
  "click",
  () => {

    showTemporaryMessage(
      "✓ Download inaanza..."
    );

  }
);

/* =====================================================
DOWNLOAD MP4
===================================================== */

downloadBtn.addEventListener(
  "click",
  async () => {

    if (!template){

      showTemporaryMessage(
        "Template bado haijapakiwa."
      );

      return;

    }

    downloadBtn.disabled =
      true;

    playBtn.disabled =
      true;

    shareBtn.disabled =
      true;

    downloadFallback.classList.remove(
      "show"
    );

    const oldText =
      downloadBtn.textContent;

    try {

      renderMessage();

      downloadBtn.textContent =
        "⏳ Opening advertisement...";

      await triggerDownloadAd();

      downloadBtn.textContent =
        "⏳ Creating MP4...";

      const response =
        await fetch(
          "/api/generate-video",
          {
            method:
              "POST",

            headers:{
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify({

                templateId:
                  template.id,

                name:
                  nameInput.value.trim() ||
                  "Rafiki"

              })

          }
        );

      if (
        !response.ok
      ){

        let errorMessage =
          "Video generation failed.";

        try {

          const errorData =
            await response.json();

          if (
            errorData &&
            errorData.error
          ){

            errorMessage =
              errorData.error;

          }

        } catch (
          parseError
        ){

          console.log(
            "Error response was not JSON.",
            parseError
          );

        }

        throw new Error(
          errorMessage
        );

      }

      const contentType =
        String(
          response.headers.get(
            "content-type"
          ) || ""
        ).toLowerCase();

      /*
        If the server accidentally
        returns JSON instead of MP4,
        show the real server error.
      */

      if (
        contentType.includes(
          "application/json"
        )
      ){

        let errorMessage =
          "Server returned an error.";

        try {

          const data =
            await response.json();

          if (
            data &&
            data.error
          ){

            errorMessage =
              data.error;

          }

        } catch (error){

          console.error(
            error
          );

        }

        throw new Error(
          errorMessage
        );

      }

      downloadBtn.textContent =
        "⏳ Receiving MP4...";

      const blob =
        await response.blob();

      if (
        !blob ||
        blob.size <= 1000
      ){

        throw new Error(
          "MP4 received but it is empty."
        );

      }

      downloadBtn.textContent =
        "⏳ Preparing download...";

      downloadBlob(
        blob,
        makeFileName() +
        ".mp4"
      );

      showTemporaryMessage(
        "✓ MP4 iko tayari — kama haikushuka, bonyeza Download MP4 hapa chini."
      );

    } catch (error) {

      console.error(
        "Video download error:",
        error
      );

      showTemporaryMessage(
        "❌ " +
        (
          error.message ||
          "Video failed. Try again."
        )
      );

    } finally {

      downloadBtn.disabled =
        false;

      playBtn.disabled =
        false;

      shareBtn.disabled =
        false;

      downloadBtn.textContent =
        oldText;

    }

  }
);

/* =====================================================
LOAD TEMPLATE
===================================================== */

async function loadTemplate(){

  const id =
    getTemplateId();

  if (!id){

    templateTitle.textContent =
      "Template not found";

    showTemporaryMessage(
      "Template ID haipo kwenye URL."
    );

    return;

  }

  try {

    const response =
      await fetch(
        "/api/templates/" +
        encodeURIComponent(id),
        {
          cache:
            "no-store"
        }
      );

    if (
      !response.ok
    ){

      throw new Error(
        "Template not found."
      );

    }

    template =
      await response.json();

    templateTitle.textContent =
      template.title ||
      "MAKYAMA MESSAGE";

    if (
      template.nameRequired
    ){

      nameInput.placeholder =
        "Enter your name";

    } else {

      nameInput.placeholder =
        "Enter a name (optional)";

    }

    renderMessage();

  } catch (error) {

    console.error(
      "Template load error:",
      error
    );

    templateTitle.textContent =
      "Unable to load template";

    showTemporaryMessage(
      "❌ " +
      (
        error.message ||
        "Template failed to load."
      )
    );

  }

}

/* =====================================================
START
===================================================== */

(async function(){

  await Promise.all([
    loadAds(),
    loadTemplate()
  ]);

})();

</script>
