  </div></div><script>

/* =====================================================
   URL
===================================================== */

const params =
  new URLSearchParams(
    window.location.search
  );

const id =
  params.get("id");


/* =====================================================
   ELEMENTS
===================================================== */

const title =
  document.getElementById(
    "title"
  );

const messageBox =
  document.getElementById(
    "messageBox"
  );

const nameBox =
  document.getElementById(
    "nameBox"
  );

const nameInput =
  document.getElementById(
    "nameInput"
  );

const playBtn =
  document.getElementById(
    "playBtn"
  );

const shareBtn =
  document.getElementById(
    "shareBtn"
  );

const downloadBtn =
  document.getElementById(
    "downloadBtn"
  );

const downloadAd =
  document.getElementById(
    "downloadAd"
  );

const downloadAdOverlay =
  document.getElementById(
    "downloadAdOverlay"
  );

const downloadAdContent =
  document.getElementById(
    "downloadAdContent"
  );


/* =====================================================
   DATA
===================================================== */

let template = null;

let ads = [];

let downloadAdData = null;


/* =====================================================
   LOAD TEMPLATE
===================================================== */

async function loadTemplate() {

  if (!id) {

    showError(
      "Message ID is missing."
    );

    return;

  }

  try {

    const response =
      await fetch(
        "/api/templates/" +
        encodeURIComponent(id)
      );

    if (!response.ok) {

      throw new Error(
        "Template not found."
      );

    }

    template =
      await response.json();

    title.textContent =
      template.title ||
      "MAKYAMA Message";


    if (
      template.nameRequired
    ) {

      nameBox.style.display =
        "block";

    }


    const sharedName =
      params.get("name");

    if (sharedName) {

      nameInput.value =
        sharedName;

    }


    renderMessage();

    await loadAds();

  } catch (error) {

    console.error(
      error
    );

    showError(
      "Message could not be loaded."
    );

  }

}


/* =====================================================
   ERROR
===================================================== */

function showError(message) {

  messageBox.innerHTML = `

    <div class="loading">

      <div style="
        font-size:42px;
        margin-bottom:5px;
      ">
        📭
      </div>

      <div style="
        color:#a1aec6;
        font-weight:700;
      ">
        ${escapeHtml(message)}
      </div>

      <a
        href="/"
        style="
          margin-top:7px;
          color:#72a5ff;
          text-decoration:none;
          font-size:11px;
        "
      >
        ← Return to messages
      </a>

    </div>

  `;

}


/* =====================================================
   RENDER MESSAGE
===================================================== */

function renderMessage() {

  if (!template) return;


  let html =
    template.html || "";


  const name =
    nameInput.value.trim() ||
    "Rafiki";


  html =
    html.replaceAll(
      "{name}",
      escapeHtml(name)
    );


  messageBox.innerHTML =
    html;


  runAnimations();

  setupTemplateClicks();

}


/* =====================================================
   RUN CSS ANIMATIONS
===================================================== */

function runAnimations() {

  const elements =
    messageBox.querySelectorAll(
      "[data-animation]"
    );


  elements.forEach(
    element => {

      const animation =
        element.dataset.animation;


      if (!animation) return;


      element.style.animation =
        "none";


      void element.offsetWidth;


      element.style.animation =
        animation;

    }
  );

}


/* =====================================================
   IMPORTANT:
   HANDLE CLICKS INSIDE TEMPLATE
===================================================== */

function setupTemplateClicks() {

  const clickable =
    messageBox.querySelectorAll(
      "[onclick]"
    );


  clickable.forEach(
    element => {

      const code =
        element.getAttribute(
          "onclick"
        ) || "";


      /*
        Remove inline onclick.
        We handle it ourselves.
      */

      element.removeAttribute(
        "onclick"
      );


      element.addEventListener(
        "click",
        function(event) {

          /*
            OPEN LOVE LETTER
          */

          if (
            code.includes(
              "openLoveLetter"
            ) ||
            code.includes(
              "mkOpenLetter"
            ) ||
            code.includes(
              "openLetterPage"
            )
          ) {

            event.preventDefault();

            event.stopPropagation();

            openTemplateLetter();

            return;

          }


          /*
            CLOSE LOVE LETTER
          */

          if (
            code.includes(
              "closeLoveLetter"
            ) ||
            code.includes(
              "mkCloseLetter"
            ) ||
            code.includes(
              "closeLetterPage"
            )
          ) {

            event.preventDefault();

            event.stopPropagation();

            closeTemplateLetter(event);

            return;

          }

        }
      );

    }
  );

}


/* =====================================================
   OPEN TEMPLATE LETTER
===================================================== */

function openTemplateLetter() {

  const scene =
    messageBox.querySelector(
      "#loveScene, .love-scene, .mk-love-scene"
    );


  const overlay =
    messageBox.querySelector(
      "#letterOverlay, #mkLetterOverlay, .letter-overlay, .mk-letter-overlay"
    );


  if (!scene || !overlay) {

    console.log(
      "Letter elements not found."
    );

    return;

  }


  /*
    Freeze animation.
  */

  scene.classList.add(
    "letter-open"
  );

  scene.classList.add(
    "mk-letter-is-open"
  );


  /*
    Open letter.
  */

  overlay.classList.add(
    "show"
  );

  overlay.classList.add(
    "mk-show-letter"
  );

}


/* =====================================================
   CLOSE TEMPLATE LETTER
===================================================== */

function closeTemplateLetter(event) {

  if (event) {

    event.preventDefault();

    event.stopPropagation();

  }


  const scene =
    messageBox.querySelector(
      "#loveScene, .love-scene, .mk-love-scene"
    );


  const overlay =
    messageBox.querySelector(
      "#letterOverlay, #mkLetterOverlay, .letter-overlay, .mk-letter-overlay"
    );


  if (!scene || !overlay) {

    return;

  }


  /*
    Close letter.
  */

  overlay.classList.remove(
    "show"
  );

  overlay.classList.remove(
    "mk-show-letter"
  );


  /*
    Resume animation.
  */

  setTimeout(
    function() {

      scene.classList.remove(
        "letter-open"
      );

      scene.classList.remove(
        "mk-letter-is-open"
      );

    },
    600
  );

}


/* =====================================================
   ESC KEY FOR LETTER
===================================================== */

messageBox.addEventListener(
  "keydown",
  function(event) {

    if (
      event.key === "Escape"
    ) {

      closeTemplateLetter(
        event
      );

    }

  }
);


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value) {

  const div =
    document.createElement(
      "div"
    );

  div.textContent =
    value;

  return div.innerHTML;

}


/* =====================================================
   NAME
===================================================== */

nameInput.addEventListener(
  "input",
  () => {

    renderMessage();

  }
);


/* =====================================================
   PLAY
===================================================== */

playBtn.addEventListener(
  "click",
  () => {

    if (!template) return;


    renderMessage();


    playBtn.textContent =
      "↻ Replay Animation";


    setTimeout(
      () => {

        playBtn.textContent =
          "▶ Play Animation";

      },
      1500
    );

  }
);


/* =====================================================
   SHARE
===================================================== */

shareBtn.addEventListener(
  "click",
  async () => {

    if (!template) return;


    const url =
      new URL(
        window.location.href
      );


    const name =
      nameInput.value.trim();


    if (name) {

      url.searchParams.set(
        "name",
        name
      );

    }


    const shareUrl =
      url.toString();


    try {

      if (
        navigator.share
      ) {

        await navigator.share({

          title:
            template.title ||
            "MAKYAMA Message",

          text:
            "Check out this animated message on MAKYAMA MESSAGES.",

          url:
            shareUrl

        });

      } else {

        await navigator.clipboard
          .writeText(
            shareUrl
          );


        showTemporaryMessage(
          "✓ Message link copied"
        );

      }

    } catch (error) {

      console.log(
        error
      );

    }

  }
);


/* =====================================================
   TEMPORARY MESSAGE
===================================================== */

function showTemporaryMessage(
  message
) {

  const old =
    document.getElementById(
      "temporaryMessage"
    );


  if (old) {

    old.remove();

  }


  const box =
    document.createElement(
      "div"
    );


  box.id =
    "temporaryMessage";


  box.textContent =
    message;


  box.style.position =
    "fixed";


  box.style.left =
    "50%";


  box.style.bottom =
    "25px";


  box.style.transform =
    "translateX(-50%)";


  box.style.padding =
    "11px 16px";


  box.style.borderRadius =
    "999px";


  box.style.background =
    "rgba(25,35,65,.95)";


  box.style.border =
    "1px solid rgba(255,255,255,.1)";


  box.style.color =
    "white";


  box.style.fontSize =
    "12px";


  box.style.fontWeight =
    "700";


  box.style.zIndex =
    "999999";


  document.body.appendChild(
    box
  );


  setTimeout(
    () => {

      box.remove();

    },
    2500
  );

}


/* =====================================================
   LOAD ADS
===================================================== */

async function loadAds() {

  try {

    const response =
      await fetch(
        "/api/ads"
      );


    if (!response.ok) {

      return;

    }


    ads =
      await response.json();


    const downloadAds =
      ads.filter(
        ad =>
          ad &&
          ad.enabled === true &&
          ad.position ===
            "download"
      );


    if (
      downloadAds.length > 0
    ) {

      downloadAdData =
        downloadAds[0];


      renderNormalAd(
        downloadAdData,
        downloadAd
      );

    } else {

      downloadAd.style.display =
        "none";

    }

  } catch (error) {

    console.log(
      "Ad loading error:",
      error
    );


    downloadAd.style.display =
      "none";

  }

}


/* =====================================================
   RENDER NORMAL AD
===================================================== */

function renderNormalAd(
  ad,
  container
) {

  if (!ad) return;


  if (!ad.code) {

    container.textContent =
      ad.title ||
      "Advertisement";

    return;

  }


  container.innerHTML = "";


  executeAdCode(
    ad.code,
    container
  );


  container.classList.add(
    "has-ad"
  );

}


/* =====================================================
   EXECUTE AD CODE
===================================================== */

function executeAdCode(
  code,
  container
) {

  const parser =
    new DOMParser();


  const parsed =
    parser.parseFromString(
      String(code),
      "text/html"
    );


  const nodes =
    Array.from(
      parsed.body.childNodes
    );


  nodes.forEach(
    node => {

      if (
        node.nodeName.toLowerCase()
        === "script"
      ) {

        const script =
          document.createElement(
            "script"
          );


        Array.from(
          node.attributes
        ).forEach(
          attribute => {

            script.setAttribute(
              attribute.name,
              attribute.value
            );

          }
        );


        script.textContent =
          node.textContent;


        container.appendChild(
          script
        );

      } else {

        container.appendChild(
          document.importNode(
            node,
            true
          )
        );

      }

    }
  );

}


/* =====================================================
   DOWNLOAD AD
===================================================== */

async function triggerDownloadAd() {

  if (
    !downloadAdData ||
    !downloadAdData.code
  ) {

    return;

  }


  downloadAdOverlay.classList.add(
    "show"
  );


  downloadAdContent.innerHTML =
    "";


  executeAdCode(
    downloadAdData.code,
    downloadAdContent
  );


  await wait(1800);


  downloadAdOverlay.classList.remove(
    "show"
  );


  downloadAdContent.innerHTML =
    "";

}


/* =====================================================
   WAIT
===================================================== */

function wait(ms) {

  return new Promise(
    resolve =>
      setTimeout(
        resolve,
        ms
      )
  );

}


/* =====================================================
   DOWNLOAD MP4
===================================================== */

downloadBtn.addEventListener(
  "click",
  async () => {

    if (!template) return;


    downloadBtn.disabled =
      true;

    playBtn.disabled =
      true;

    shareBtn.disabled =
      true;


    const oldText =
      downloadBtn.textContent;


    try {

      try {

        await fetch(
          "/api/analytics/download",
          {

            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify({
                templateId:
                  template.id
              })

          }
        );

      } catch (
        analyticsError
      ) {

        console.log(
          "Analytics error:",
          analyticsError
        );

      }


      renderMessage();


      downloadBtn.textContent =
        "⏳ Opening advertisement...";


      await triggerDownloadAd();


      downloadBtn.textContent =
        "⏳ Creating MP4...";


      const response =
        await fetch(
          "/api/generate-video",
          {

            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify({

                templateId:
                  template.id,

                name:
                  nameInput.value.trim() ||
                  "Rafiki"

              })

          }
        );


      if (!response.ok) {

        let errorMessage =
          "Video generation failed.";


        try {

          const errorData =
            await response.json();


          if (
            errorData &&
            errorData.error
          ) {

            errorMessage =
              errorData.error;

          }

        } catch (
          parseError
        ) {

          console.log(
            parseError
          );

        }


        throw new Error(
          errorMessage
        );

      }


      const blob =
        await response.blob();


      if (
        !blob ||
        blob.size === 0
      ) {

        throw new Error(
          "Empty video received."
        );

      }


      downloadBlob(
        blob,
        makeFileName() +
        ".mp4"
      );


      showTemporaryMessage(
        "✓ MP4 video downloaded"
      );


    } catch (error) {

      console.error(
        "Video download error:",
        error
      );


      showTemporaryMessage(
        "❌ " +
        (
          error.message ||
          "Video failed. Try again."
        )
      );


    } finally {

      downloadBtn.disabled =
        false;


      playBtn.disabled =
        false;


      shareBtn.disabled =
        false;


      downloadBtn.textContent =
        oldText;

    }

  }
);


/* =====================================================
   DOWNLOAD BLOB
===================================================== */

function downloadBlob(
  blob,
  filename
) {

  const url =
    URL.createObjectURL(
      blob
    );


  const link =
    document.createElement(
      "a"
    );


  link.href =
    url;


  link.download =
    filename;


  document.body.appendChild(
    link
  );


  link.click();


  link.remove();


  setTimeout(
    () => {

      URL.revokeObjectURL(
        url
      );

    },
    5000
  );

}


/* =====================================================
   FILE NAME
===================================================== */

function makeFileName() {

  const base =
    template &&
    template.title
      ? template.title
      : "MAKYAMA_Message";


  const clean =
    base
      .replace(
        /[^a-z0-9_\- ]/gi,
        ""
      )
      .trim()
      .replace(
        /\s+/g,
        "_"
      );


  return (
    "MAKYAMA_" +
    (
      clean ||
      "Message"
    )
  );

}
