<script>

"use strict";

/* =========================================================
   MAKYAMA MESSAGES
   TEMPLATE PAGE
   ========================================================= */

const params =
  new URLSearchParams(
    window.location.search
  );

const templateId =
  params.get("id");

let templateData = null;

let originalHTML = "";

let animationScripts = [];

let currentName = "";

const $ = id =>
  document.getElementById(id);


/* =========================================================
   HELPERS
   ========================================================= */

function escapeHTML(value){

  return String(
    value ?? ""
  ).replace(
    /[&<>"']/g,
    char => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[char])
  );

}


function showToast(message){

  const toast =
    $("toast");

  toast.textContent =
    message;

  toast.classList.add(
    "show"
  );

  clearTimeout(
    window.__toastTimer
  );

  window.__toastTimer =
    setTimeout(
      () => {
        toast.classList.remove(
          "show"
        );
      },
      2600
    );

}


function setStatus(message){

  $("status").textContent =
    message || "";

}


function setMeta(
  selector,
  content
){

  const element =
    document.querySelector(
      selector
    );

  if(
    element &&
    content
  ){
    element.setAttribute(
      "content",
      content
    );
  }

}


/* =========================================================
   SEO
   ========================================================= */

function updateSEO(){

  if(!templateData){
    return;
  }

  const title =
    String(
      templateData.title ||
      "Animated Message"
    ).trim();

  const description =
    String(
      templateData.description ||
      (
        "Create and share this beautiful " +
        title +
        " animated message with MAKYAMA MESSAGES."
      )
    ).trim();

  /*
    The current public page still uses /template?id=...
    until the backend's /message/:id route is added.
  */

  const canonical =
    window.location.origin +
    "/template?id=" +
    encodeURIComponent(
      templateData.id ||
      templateId ||
      ""
    );

  document.title =
    title +
    " | MAKYAMA MESSAGES";

  setMeta(
    "#metaDescription",
    description
  );

  setMeta(
    "#ogTitle",
    title +
    " | MAKYAMA MESSAGES"
  );

  setMeta(
    "#ogDescription",
    description
  );

  setMeta(
    "#twitterTitle",
    title +
    " | MAKYAMA MESSAGES"
  );

  setMeta(
    "#twitterDescription",
    description
  );

  const canonical =
    document.querySelector(
      "#canonicalUrl"
    );

  if(canonical){

    canonical.href =
      canonical;

  }

  const ogUrl =
    document.querySelector(
      "#ogUrl"
    );

  if(ogUrl){

    ogUrl.setAttribute(
      "content",
      canonical
    );

  }

}


/* =========================================================
   NAME
   ========================================================= */

function applyName(html){

  return String(
    html || ""
  ).replace(
    /\{name\}/gi,
    escapeHTML(
      currentName
    )
  );

}


/* =========================================================
   RENDER TEMPLATE
   ========================================================= */

function renderTemplate(){

  if(!originalHTML){
    return;
  }

  const box =
    $("messageBox");

  /*
    Remove old template
    content.
  */

  box.innerHTML =
    applyName(
      originalHTML
    );

  /*
    Re-run scripts after
    rendering the HTML.
  */

  executeTemplateScripts();

  /*
    Generic data-animation
    support.
  */

  runAnimations();

  /*
    Allow template-specific
    interactive controls.
  */

  setupInteractions();

}


/* =========================================================
   TEMPLATE SCRIPTS
   ========================================================= */

function executeTemplateScripts(){

  const scripts =
    Array.from(
      $("messageBox")
        .querySelectorAll(
          "script"
        )
    );

  animationScripts = [];

  scripts.forEach(
    oldScript => {

      const newScript =
        document.createElement(
          "script"
        );

      Array.from(
        oldScript.attributes
      ).forEach(
        attribute => {

          newScript.setAttribute(
            attribute.name,
            attribute.value
          );

        }
      );

      newScript.textContent =
        oldScript.textContent;

      animationScripts.push(
        newScript
      );

      oldScript.replaceWith(
        newScript
      );

    }
  );

}


/* =========================================================
   ANIMATION SUPPORT
   ========================================================= */

function runAnimations(){

  const elements =
    document.querySelectorAll(
      "[data-animation]"
    );

  elements.forEach(
    element => {

      const animation =
        element.getAttribute(
          "data-animation"
        );

      if(!animation){
        return;
      }

      /*
        Restart CSS animation.
      */

      element.style.animation =
        "none";

      void element.offsetWidth;

      element.style.animation =
        animation;

    }
  );

}


/* =========================================================
   GENERIC INTERACTIONS
   ========================================================= */

function setupInteractions(){

  /*
    Templates can use:

    data-mk-action="..."

    This keeps interactive
    templates flexible.
  */

  document
    .querySelectorAll(
      "[data-mk-action]"
    )
    .forEach(
      element => {

        if(
          element.dataset
            .mkBound === "1"
        ){
          return;
        }

        element.dataset.mkBound =
          "1";

        element.addEventListener(
          "click",
          event => {

            const action =
              element.getAttribute(
                "data-mk-action"
              );

            handleAction(
              action,
              element,
              event
            );

          }
        );

      }
    );

}


/* =========================================================
   ACTION HANDLER
   ========================================================= */

function handleAction(
  action,
  element,
  event
){

  if(!action){
    return;
  }

  /*
    Built-in simple actions.
  */

  if(action === "hide"){

    element.style.display =
      "none";

    return;

  }


  if(action === "show"){

    const target =
      element.getAttribute(
        "data-target"
      );

    if(target){

      const targetElement =
        document.querySelector(
          target
        );

      if(targetElement){

        targetElement.style.display =
          "";

      }

    }

    return;

  }


  if(action === "toggle"){

    const target =
      element.getAttribute(
        "data-target"
      );

    if(target){

      const targetElement =
        document.querySelector(
          target
        );

      if(targetElement){

        const hidden =
          getComputedStyle(
            targetElement
          ).display === "none";

        targetElement.style.display =
          hidden
            ? ""
            : "none";

      }

    }

    return;

  }


  /*
    Template-specific actions
    can be handled inside the
    template's own script.
  */

}


/* =========================================================
   PLAY / REPLAY
   ========================================================= */

function playAnimation(){

  renderTemplate();

  setStatus(
    "Animation replayed."
  );

  setTimeout(
    () => setStatus(""),
    1800
  );

}


$("playBtn")
  .addEventListener(
    "click",
    playAnimation
  );


/* =========================================================
   SHARE
   ========================================================= */

async function sharePage(){

  const title =
    templateData?.title ||
    "MAKYAMA MESSAGES";

  const shareURL =
    window.location.href;

  const shareData = {

    title:
      title +
      " | MAKYAMA MESSAGES",

    text:
      "Check out this animated message from MAKYAMA MESSAGES.",

    url:
      shareURL

  };

  try{

    if(
      navigator.share
    ){

      await navigator.share(
        shareData
      );

      return;

    }

    if(
      navigator.clipboard
    ){

      await navigator.clipboard.writeText(
        shareURL
      );

      showToast(
        "Link copied!"
      );

      return;

    }

    showToast(
      "Copy this page link to share."
    );

  }catch(error){

    if(
      error &&
      error.name ===
      "AbortError"
    ){
      return;
    }

    showToast(
      "Unable to share right now."
    );

  }

}


$("shareBtn")
  .addEventListener(
    "click",
    sharePage
  );


/* =========================================================
   NAME INPUT
   ========================================================= */

$("nameInput")
  .addEventListener(
    "input",
    event => {

      currentName =
        event.target.value
          .trim();

      renderTemplate();

    }
  );


/* =========================================================
   LOAD ADS
   ========================================================= */

async function loadAds(){

  const container =
    $("adContainer");

  if(!container){
    return;
  }

  try{

    const response =
      await fetch(
        "/api/ads",
        {
          cache:"no-store"
        }
      );

    if(
      !response.ok
    ){
      return;
    }

    const data =
      await response.json();

    /*
      Keep compatibility with
      the existing ad API.

      Only top/middle are used
      here. No "download"
      position is introduced.
    */

    const ads =
      Array.isArray(data)
        ? data
        : (
            Array.isArray(
              data.ads
            )
              ? data.ads
              : []
          );

    const enabled =
      ads.filter(
        ad =>
          ad &&
          (
            ad.enabled === true ||
            ad.active === true ||
            ad.status === "enabled"
          )
      );

    let ad =
      enabled.find(
        item =>
          item.position ===
          "middle"
      );

    if(!ad){

      ad =
        enabled.find(
          item =>
            item.position ===
            "top"
        );

    }

    if(!ad){
      return;
    }

    renderAd(
      ad,
      container
    );

  }catch(error){

    console.warn(
      "Ad loading failed:",
      error
    );

  }

}


/* =========================================================
   RENDER AD
   ========================================================= */

function renderAd(
  ad,
  container
){

  container.innerHTML =
    "";

  /*
    Different admin/ad
    field names are supported.
  */

  const code =
    ad.html ||
    ad.code ||
    ad.script ||
    ad.content ||
    "";

  if(!code){
    return;
  }

  /*
    If the ad contains a
    script, insert HTML first
    then execute scripts.
  */

  const wrapper =
    document.createElement(
      "div"
    );

  wrapper.innerHTML =
    code;

  container.appendChild(
    wrapper
  );

  const scripts =
    Array.from(
      wrapper.querySelectorAll(
        "script"
      )
    );

  scripts.forEach(
    oldScript => {

      const script =
        document.createElement(
          "script"
        );

      Array.from(
        oldScript.attributes
      ).forEach(
        attribute => {

          script.setAttribute(
            attribute.name,
            attribute.value
          );

        }
      );

      script.textContent =
        oldScript.textContent;

      oldScript.replaceWith(
        script
      );

    }
  );

}


/* =========================================================
   LOAD TEMPLATE
   ========================================================= */

async function loadTemplate(){

  if(!templateId){

    $("title").textContent =
      "Message Not Found";

    $("messageBox").innerHTML =
      `
        <div class="empty">
          No message was selected.
        </div>
      `;

    setStatus(
      "Missing template ID."
    );

    return;

  }

  try{

    setStatus(
      "Loading..."
    );

    const response =
      await fetch(
        "/api/templates/" +
        encodeURIComponent(
          templateId
        ),
        {
          cache:"no-store"
        }
      );

    if(
      !response.ok
    ){

      throw new Error(
        "Template not found."
      );

    }

    const result =
      await response.json();

    /*
      Support either:

      { ...template }

      or

      { template: {...} }
    */

    templateData =
      result.template ||
      result.data ||
      result;

    if(
      !templateData ||
      typeof templateData !==
      "object"
    ){

      throw new Error(
        "Invalid template data."
      );

    }

    /*
      Title
    */

    const title =
      String(
        templateData.title ||
        "Animated Message"
      );

    $("title").textContent =
      title;

    /*
      Description for SEO
    */

    updateSEO();

    /*
      Name field
    */

    if(
      templateData.nameRequired ===
      true
    ){

      $("nameBox").style.display =
        "block";

    }else{

      $("nameBox").style.display =
        "none";

    }

    /*
      Template HTML
    */

    originalHTML =
      String(
        templateData.html ||
        ""
      );

    if(!originalHTML){

      $("messageBox").innerHTML =
        `
          <div class="empty">
            This message has no content yet.
          </div>
        `;

    }else{

      renderTemplate();

    }

    setStatus("");

    /*
      Ads load separately so
      a blocked ad never prevents
      the message itself from
      loading.
    */

    loadAds();

  }catch(error){

    console.error(
      "Template loading error:",
      error
    );

    $("title").textContent =
      "Message Not Found";

    $("messageBox").innerHTML =
      `
        <div class="empty">
          This message could not be loaded.
        </div>
      `;

    setStatus(
      error.message ||
      "Unable to load message."
    );

  }

}

loadTemplate();
